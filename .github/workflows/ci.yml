name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r ingest/requirements.txt
          pip install pytest
      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: pytest -v --junitxml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}
          path: report.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dataeko-capstone:latest"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr 'A-Z' 'a-z')
          docker build -t "$IMAGE_NAME_LOWER" .
          docker push "$IMAGE_NAME_LOWER"
